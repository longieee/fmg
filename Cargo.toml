[package]
name = "fmg"
version = "0.1.0"
edition = "2024"
description = "Fast, Obsidian-native CLI for traversing [[WikiLink]] relationships in frontmatter markdown vaults"
license = "MIT"
repository = "https://github.com/longieee/fmg"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
petgraph = "0.7"
regex = "1"
walkdir = "2"
toml = "0.8"
